# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rinkside
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
